apiVersion: batch/v1
kind: Job
metadata:
  name: vedio-h3-lightx2v-models-verify-v011
  namespace: verdantflare-vedio
  labels:
    app.kubernetes.io/name: vedio-minimax-h3-lightx2v-benchmark
    app.kubernetes.io/component: model-verify
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vedio-minimax-h3-lightx2v-benchmark
        app.kubernetes.io/component: model-verify
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: 10.241.109.6
      containers:
        - name: verify
          image: registry.cn-qingdao.aliyuncs.com/wod/verdantflare-app:vedio-minimax-h3-lightx2v-benchmark-v0.1.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
            - |
              test -f /models/MiniMax-H3-Diffusers/modular_model_index.json
              test -f /models/MiniMax-H3-Diffusers/text_encoder/model.safetensors.index.json
              test -f /models/MiniMax-H3-Diffusers/transformer_ref/diffusion_pytorch_model.safetensors.index.json
              test -f /models/MiniMax-H3-Diffusers/vae/diffusion_pytorch_model.safetensors.index.json
              test -f /models/MiniMax-H3-Diffusers/audio_vae/diffusion_pytorch_model.safetensors
          env:
            - name: HF_ENDPOINT
              value: https://hf-mirror.com
            - name: HF_HUB_DISABLE_XET
              value: "1"
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 16Gi
          volumeMounts:
            - name: models
              mountPath: /models/MiniMax-H3-Diffusers
              subPath: MiniMax-H3-Diffusers
              readOnly: true
            - name: models
              mountPath: /models/MiniMax-H3-Turbo
              subPath: MiniMax-H3-Turbo
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: minimax-h3-models
