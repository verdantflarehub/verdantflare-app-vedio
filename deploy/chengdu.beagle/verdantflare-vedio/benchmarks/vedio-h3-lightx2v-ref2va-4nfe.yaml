apiVersion: batch/v1
kind: Job
metadata:
  name: vedio-h3-lightx2v-ref2va-4nfe-v011
  namespace: verdantflare-vedio
  labels:
    app.kubernetes.io/name: vedio-minimax-h3-lightx2v-benchmark
    app.kubernetes.io/component: benchmark
    verdantflare.com/benchmark-profile: lightx2v-ref2va-4nfe
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vedio-minimax-h3-lightx2v-benchmark
        app.kubernetes.io/component: benchmark
        verdantflare.com/benchmark-profile: lightx2v-ref2va-4nfe
    spec:
      schedulerName: hami-scheduler
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: 10.241.109.6
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: [NVIDIA-GeForce-RTX-4090]
                  - key: nvidia.com/gpu.sharing-strategy
                    operator: In
                    values: [none]
      initContainers:
        - name: prepare-approved-input
          image: registry.cn-qingdao.aliyuncs.com/wod/verdantflare-app:vedio-minimax-h3-lightx2v-benchmark-v0.1.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
            - |
              /usr/local/bin/prepare-approved-lightx2v-input
              install -d "${H3_OUTPUT_DIR}"
          env:
            - name: H3_SOURCE_VIDEO_TASK_ID
              value: video_task_4eba592c251748ff9c3220bcea6b40ca
            - name: H3_SOURCE_PROJECT_ID
              value: promo_mengsk_xiaoyue_30s_v1
            - name: H3_SOURCE_IDEMPOTENCY_KEY
              value: PROD_SMOKE_FULL_INT8_BASE20_20260902/attempt_01
            - name: H3_JOBS_JSON
              value: /data/projects/h3/lightx2v/input-prod-smoke-20260902/ref2va.json
            - name: H3_OUTPUT_DIR
              value: /data/projects/h3/benchmarks/2026-09-04-lightx2v-ref2va-4nfe-v012
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: projects
              mountPath: /data/projects
      containers:
        - name: benchmark
          image: registry.cn-qingdao.aliyuncs.com/wod/verdantflare-app:vedio-minimax-h3-lightx2v-benchmark-v0.1.1
          imagePullPolicy: IfNotPresent
          env:
            - name: H3_MODEL_PATH
              value: /models/MiniMax-H3-Diffusers
            - name: H3_LORA_PATH
              value: /models/MiniMax-H3-Turbo/minimax_h3_ref2v_turbo_4step_v0.1_bf16.safetensors
            - name: H3_JOBS_JSON
              value: /data/projects/h3/lightx2v/input-prod-smoke-20260902/ref2va.json
            - name: H3_OUTPUT_DIR
              value: /data/projects/h3/benchmarks/2026-09-04-lightx2v-ref2va-4nfe-v012
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
          resources:
            requests:
              cpu: "48"
              memory: 192Gi
              nvidia.com/gpu: "1"
              nvidia.com/gpumem: "24564"
              nvidia.com/gpucores: "100"
            limits:
              cpu: "96"
              memory: 256Gi
              nvidia.com/gpu: "1"
              nvidia.com/gpumem: "24564"
              nvidia.com/gpucores: "100"
          volumeMounts:
            - name: models
              mountPath: /models/MiniMax-H3-Diffusers
              subPath: MiniMax-H3-Diffusers
              readOnly: true
            - name: models
              mountPath: /models/MiniMax-H3-Turbo
              subPath: MiniMax-H3-Turbo
              readOnly: true
            - name: projects
              mountPath: /data/projects
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: minimax-h3-models
        - name: projects
          persistentVolumeClaim:
            claimName: vedio-projects
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
