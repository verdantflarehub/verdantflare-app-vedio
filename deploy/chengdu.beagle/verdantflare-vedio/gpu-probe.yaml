apiVersion: batch/v1
kind: Job
metadata:
  name: vedio-h3-gpu-probe
  namespace: verdantflare-vedio
  labels:
    app.kubernetes.io/part-of: verdantflare-vedio
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vedio-h3-gpu-probe
    spec:
      schedulerName: hami-scheduler
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: 10.241.109.6
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-4090
                  - key: nvidia.com/gpu.sharing-strategy
                    operator: In
                    values:
                      - none
      containers:
        - name: probe
          image: registry.cn-qingdao.aliyuncs.com/wod/cuda:13.0-py312-szc
          command:
            - /bin/bash
            - -ceu
            - |
              test "$(nvidia-smi --query-gpu=uuid --format=csv,noheader | sort -u | wc -l)" -eq 2
              nvidia-smi --query-gpu=uuid,name,memory.total,driver_version --format=csv,noheader
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
              nvidia.com/gpu: "2"
            limits:
              cpu: "2"
              memory: 2Gi
              nvidia.com/gpu: "2"
