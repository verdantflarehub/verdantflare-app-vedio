apiVersion: apps/v1
kind: Deployment
metadata:
  name: vedio-minimax-h3-api
spec:
  replicas: 1
  progressDeadlineSeconds: 86400
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vedio-minimax-h3-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vedio-minimax-h3-api
    spec:
      schedulerName: hami-scheduler
      hostIPC: true
      nodeSelector:
        kubernetes.io/hostname: 10.241.109.6
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-4090
                  - key: nvidia.com/gpu.sharing-strategy
                    operator: In
                    values:
                      - none
      containers:
        - name: api
          image: registry.cn-qingdao.aliyuncs.com/wod/verdantflare-app:vedio-minimax-h3-api-v0.2.0
          imagePullPolicy: IfNotPresent
          env:
            - name: HF_ENDPOINT
              value: https://hf-mirror.com
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: H3_OUTPUT_PATH
              value: /data/projects/h3/tasks
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "48"
              memory: 192Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "96"
              memory: 256Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 2880
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: models
              mountPath: /models/MiniMax-H3
              subPath: MiniMax-H3
            - name: projects
              mountPath: /data/projects
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: minimax-h3-models
        - name: projects
          persistentVolumeClaim:
            claimName: vedio-projects
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vedio-mcp-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vedio-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vedio-mcp-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: 10.241.109.6
      containers:
        - name: api
          image: registry.cn-qingdao.aliyuncs.com/wod/verdantflare-app:vedio-mcp-server-v0.1.3
          imagePullPolicy: IfNotPresent
          env:
            - name: VIDEO_ARTIFACT_ROOT
              value: /data/video-mcp
            - name: VIDEO_ASSET_IMPORT_ORIGINS
              value: https://cache.ali.wodcloud.com
            - name: VIDEO_MCP_PUBLIC_BASE_URL
              value: https://mcp.cn-chengdu.bc-cloud.com/video
            - name: VIDEO_MCP_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vedio-mcp-auth
                  key: VIDEO_MCP_BEARER_TOKEN
            - name: VIDEO_MCP_ALLOWED_HOSTS
              value: mcp.cn-chengdu.bc-cloud.com,127.0.0.1:*,localhost:*,[::1]:*
            - name: VIDEO_MCP_ALLOWED_ORIGINS
              value: https://mcp.cn-chengdu.bc-cloud.com,http://127.0.0.1:*,http://localhost:*,http://[::1]:*
            - name: VIDEO_MCP_RUNTIME_BASE_URL
              value: http://vedio-mcp-server:8000
            - name: H3_RUNTIME_URL
              value: http://vedio-minimax-h3-api:8000
            - name: H3_RUNTIME_VERSION
              value: vedio-minimax-h3-api-v0.2.0
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: projects
              mountPath: /data
      volumes:
        - name: projects
          persistentVolumeClaim:
            claimName: vedio-projects
